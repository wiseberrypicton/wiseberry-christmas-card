<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>A Christmas message from Wiseberry Picton</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 16px; background: #f6f4f1; color: #4b4141;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap { width: min(953px, 100%); text-align: center; }
    .stage { position: relative; width: 100%; perspective: 1600px; }
    .artboard {
      position: relative; width: 100%; aspect-ratio: 953 / 647;
      filter: drop-shadow(0 14px 24px rgba(30, 20, 20, .16));
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .artboard img {
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      object-fit: contain; user-select: none; -webkit-user-drag: none;
    }
    .envelope {
      z-index: 3; opacity: 1; transform-origin: center top;
      transition: opacity .85s ease, transform .95s cubic-bezier(.2,.72,.18,1);
    }
    .artboard.envelope-open .envelope {
      opacity: 0; transform: translateY(9%) scale(.94) rotateX(18deg);
      pointer-events: none;
    }
    .front {
      z-index: 2; transform-origin: left center; backface-visibility: hidden;
      transition: transform 1.25s cubic-bezier(.2,.72,.18,1);
    }
    .artboard.card-open .front { transform: rotateY(-180deg); }
    .inside { z-index: 1; }
    .artboard:focus-visible { outline: 3px solid #8b2448; outline-offset: 7px; }
    .controls { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 24px; padding: 12px 23px; cursor: pointer;
      background: #741b3b; color: #fff; font-size: 14px; font-weight: 600;
    }
    button.secondary { background: transparent; color: #741b3b; border: 1px solid #b99aa5; }
    button:focus-visible { outline: 3px solid #c18a9e; outline-offset: 3px; }
    .instruction { margin: 0 0 18px; color: #665d5d; font-size: 14px; line-height: 1.5; }
    .small { margin: 15px 0 0; color: #817878; font-size: 12px; }
    @media (max-width: 600px) { body { padding: 22px 10px; } .controls { margin-top: 16px; } }
    @media (prefers-reduced-motion: reduce) { .envelope, .front { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="instruction" id="instruction">Click the envelope to open your Christmas card.</p>
    <div class="stage">
      <div class="artboard" id="artboard" role="button" tabindex="0" aria-label="Open the Christmas envelope" aria-expanded="false">
        <img class="inside" src="page-3.png" alt="Inside message: Wishing you a wonderful Christmas and a Happy New Year from all of us at Wiseberry Picton">
        <img class="front" src="page-2.png" alt="Original Wiseberry Picton Christmas card featuring a dachshund dressed as Santa">
        <img class="envelope" src="page-1.png" alt="Original cream envelope artwork">
      </div>
    </div>
    <div class="controls">
      <button id="action" type="button">Open envelope</button>
      <button id="restart" class="secondary" type="button">Start again</button>
    </div>
    <p class="small">A Christmas greeting from Wiseberry Picton</p>
  </main>
  <script>
    const board = document.getElementById('artboard');
    const instruction = document.getElementById('instruction');
    const action = document.getElementById('action');
    const restart = document.getElementById('restart');
    let step = 0; // 0 envelope, 1 card front, 2 inside message

    function render() {
      board.classList.toggle('envelope-open', step >= 1);
      board.classList.toggle('card-open', step >= 2);
      board.setAttribute('aria-expanded', String(step > 0));
      board.setAttribute('aria-label', step === 0 ? 'Open the Christmas envelope' : step === 1 ? 'Open the Christmas card' : 'Christmas card message revealed');
      instruction.textContent = step === 0 ? 'Click the envelope to open your Christmas card.' : step === 1 ? 'Click the Christmas card to reveal your message.' : 'Wishing you a wonderful Christmas and a Happy New Year!';
      action.textContent = step === 0 ? 'Open envelope' : step === 1 ? 'Open card' : 'Close card';
    }
    function advance() { step = step === 2 ? 1 : step + 1; render(); }
    board.addEventListener('click', advance);
    board.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); advance(); }
    });
    action.addEventListener('click', advance);
    restart.addEventListener('click', () => { step = 0; render(); });
    render();
  </script>
</body>
</html>
